[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-sentinel"
version = "0.1.0"
description = "State-based anomaly detector for Modbus TCP pcaps: behavioral baselining, not signatures"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "LeightonSec" }]
keywords = ["security", "cybersecurity", "modbus", "ot", "ics", "anomaly-detection", "pcap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Exact pins: these tools install into their own venv, so == avoids the
    # gate's unpinned_deps finding without the resolver conflicts that make
    # == an anti-pattern for redistributable libraries. Keep in sync with
    # requirements.txt.
    #
    # scapy is the ONLY runtime dependency, used solely for pcap I/O and
    # ordered TCP payload delivery. MBAP/PDU parsing is hand-rolled; the CLI
    # is argparse. Locked decision; see DECISIONS.md D3 before adding
    # anything here.
    # 2.7.0 floor: GHSA-cq46-m9x9-j8w2 (pickle deserialization in session
    # loading) covers <= 2.6.1 with no patched release at publish time; 2.7.0
    # is outside the vulnerable range. Do not pin below it.
    "scapy==2.7.0",
]

[project.scripts]
modbus-sentinel = "modbus_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/LeightonSec/modbus-sentinel"
Issues = "https://github.com/LeightonSec/modbus-sentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["modbus_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Suite-wide no-hang bound (pytest-timeout): no test, present or future, runs
# unbounded. Gate 1 criterion 3 tests carry tighter 5s marks on top of this.
timeout = 30
# Coverage on EVERY pytest invocation (make check, bare pytest, CI), so the
# measurement cannot be silently dropped by changing how pytest is called. The
# XML report is for CI consumption; it and .coverage are gitignored.
# Floor is 97.9, not 98: coverage is 287/293 = 97.95%, which the report table
# DISPLAYS as 98% (rounded) but --cov-fail-under compares unrounded, so a floor
# of 98 fails at the number it claims. 97.9 is the truthful floor with ~zero
# slack. The 6 uncovered statements are error branches, logged in GATES.md.
addopts = "--tb=short -q --cov=modbus_sentinel --cov-report=term-missing --cov-report=xml --cov-fail-under=97.9"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# golden_corpus / golden_support are local test modules, not third-party; tell
# ruff so import grouping stays stable instead of guessing them into the wrong
# block (which is what triggered the I001 churn).
known-first-party = ["modbus_sentinel", "golden_corpus", "golden_support"]
